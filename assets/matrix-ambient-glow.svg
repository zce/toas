<svg xmlns="http://www.w3.org/2000/svg" width="520" height="275" viewBox="0 0 520 275">
  <!-- Fully transparent perimeter keeps the glow soft without runtime blur. -->
  <defs>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(260 140) scale(211 108)">
      <stop offset="0" stop-color="#72b3ff" stop-opacity="0.38"/>
      <stop offset="0.27" stop-color="#568bef" stop-opacity="0.26"/>
      <stop offset="0.62" stop-color="#4366d4" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#3555bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="left" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(192 151) scale(142 80)">
      <stop offset="0" stop-color="#68bcff" stop-opacity="0.22"/>
      <stop offset="0.36" stop-color="#4289f4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#426ce2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="right" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(333 126) scale(147 89)">
      <stop offset="0" stop-color="#548dff" stop-opacity="0.19"/>
      <stop offset="0.46" stop-color="#465fdf" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#465fdf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="260" cy="140" rx="211" ry="108" fill="url(#ambient)"/>
  <ellipse cx="192" cy="151" rx="142" ry="80" fill="url(#left)"/>
  <ellipse cx="333" cy="126" rx="147" ry="89" fill="url(#right)"/>
</svg>
